name: ha-recall
services:
  memory:
    build:
      context: .
      args:
        WITH_LOCAL_MODEL: ${WITH_LOCAL_MODEL:-0}
    restart: unless-stopped
    environment:
      HA_RECALL_TOKEN: ${HA_RECALL_TOKEN:?Set a random token of at least 32 characters}
      HA_RECALL_TRANSPORT: ${HA_RECALL_TRANSPORT:-http}
      HA_RECALL_NAMESPACES: ${HA_RECALL_NAMESPACES:-home,technical}
      HA_RECALL_EMBEDDING_URL: ${HA_RECALL_EMBEDDING_URL:-}
      HA_RECALL_EMBEDDING_MODEL: ${HA_RECALL_EMBEDDING_MODEL:-model2vec}
      HA_RECALL_EMBEDDING_KEY: ${HA_RECALL_EMBEDDING_KEY:-}
      HA_RECALL_HA_URL: ${HA_RECALL_HA_URL:-}
      HA_RECALL_HA_TOKEN: ${HA_RECALL_HA_TOKEN:-}
      HA_RECALL_HA_INSTANCE: ${HA_RECALL_HA_INSTANCE:-home}
      HA_RECALL_HA_NAMESPACE: ${HA_RECALL_HA_NAMESPACE:-home}
      HA_RECALL_SYNC_INTERVAL: ${HA_RECALL_SYNC_INTERVAL:-300}
    ports:
      - "127.0.0.1:8004:8004"
    volumes:
      - memory:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  memory:
