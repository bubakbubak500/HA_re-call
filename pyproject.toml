[project]
name = "ha-recall"
version = "1.0.0"
description = "Entity-first semantic memory for Home Assistant"
requires-python = ">=3.12"
dependencies = ["fastmcp==3.4.8", "httpx>=0.28,<1", "websockets>=15,<17", "pyyaml>=6,<7"]

[project.optional-dependencies]
local-model = ["model2vec==0.9.0"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.15,<1"]

[project.scripts]
ha-recall = "ha_recall.server:main"
ha-recall-import = "ha_recall.ha_sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ha_recall"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests_ha"]
asyncio_mode = "auto"
addopts = "-q"
